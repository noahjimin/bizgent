spring:
  application:
    name: bizgent
  profiles:
    # mock: DB 없이 세션 데모 데이터로 화면 동작 (화면 구현 단계 기본값)
    # db  : Oracle 연동. 접속 정보는 application-local.yml(커밋 금지)에 작성
    default: mock
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    session:
      timeout: 120m

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
