spring:
  application:
    name: bizgent
  profiles:
    # db: Oracle 연동(기본값). 접속 계정은 application-local.yml(커밋 금지)에 작성
    default: db
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    session:
      timeout: 120m
      # 첫 접속 때 주소에 ;jsessionid가 붙으면 LoginCheckInterceptor가 경로를 못 맞춰 랜딩으로 돌려보낸다
      tracking-modes: cookie

bizgent:
  demo:
    # 시연 계정: 로그인 화면 "임시 계정" 카드에 공개하는 값이라 설정 파일에 둔다.
    email: demo@bizgent.kr
    password: BizGentDemo26!

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bizgent.mapper.row,com.bizgent.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
