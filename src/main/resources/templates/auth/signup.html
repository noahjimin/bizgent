<!DOCTYPE html>
<!-- 회원가입 (SCR-U-001). 약관 동의 기록이 없으면 가입 양식 대신 약관 카드만 보여 주고, 동의하면 이 화면으로 다시 온다. -->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/common :: head('회원가입')}"></head>
<body data-responsive>
<div class="pd-scope flex min-h-screen flex-col items-center justify-center gap-[32px] bg-[#eff6ff] px-[16px] py-[40px] md:py-[72px]">
  <div th:replace="~{fragments/common :: entryBrand(false, false)}"></div>
  <form th:unless="${showTerms}" method="post" th:action="@{/signup}" novalidate
        class="flex w-full max-w-[480px] flex-col gap-[28px] rounded-[24px] bg-white p-[24px] md:p-[40px] shadow-[0px_12px_16px_rgba(15,23,42,0.05)]">
    <div class="text-center">
      <h1 class="text-[34px] leading-[36px] font-extrabold text-[#0f172a]">회원가입</h1>
      <p class="mt-[8px] text-[16px] leading-[22px] font-medium text-[#64748b]">몇 가지 정보만 입력하면 바로 시작할 수 있어요</p>
    </div>
    <div class="flex flex-col gap-[20px]">
      <label th:replace="~{fragments/auth-parts :: authField('이름', 'memberName', 'text', ${memberName}, '이름을 입력하세요 (2~20자)', true, ${errors?.get('memberName')})}"></label>
      <label th:replace="~{fragments/auth-parts :: authField('이메일', 'email', 'email', ${email}, '이메일을 입력하세요', true, ${errors?.get('email')})}"></label>
      <label th:replace="~{fragments/auth-parts :: authField('비밀번호', 'password', 'password', '', '비밀번호를 입력하세요', true, ${errors?.get('password')})}"></label>
      <label th:replace="~{fragments/auth-parts :: authField('비밀번호 확인', 'passwordCheck', 'password', '', '비밀번호를 다시 입력하세요', true, ${errors?.get('passwordCheck')})}"></label>
      <label th:replace="~{fragments/auth-parts :: authField('매장명', 'storeName', 'text', ${storeName}, '매장명을 입력하세요', true, ${errors?.get('storeName')})}"></label>
      <label th:replace="~{fragments/auth-parts :: authSelect('업종', 'category', ${categories}, ${category}, '업종을 선택하세요', true, ${errors?.get('category')})}"></label>
      <label th:replace="~{fragments/auth-parts :: authField('연락처 (선택)', 'phone', 'tel', ${phone}, '010-0000-0000', true, ${errors?.get('phone')})}"></label>
    </div>
    <button type="submit" class="btn-primary h-[56px] rounded-[12px] bg-gradient-to-r from-[#2563eb] to-[#1d4ed8] text-[20px] font-bold text-white">가입하기</button>
    <p class="text-center text-[16px] font-medium text-[#64748b]">
      이미 계정이 있으신가요? <a th:href="@{/login}" class="link-hover font-bold text-[#047857]">로그인</a>
    </p>
  </form>
  <div th:replace="~{fragments/auth-parts :: termsModal('/signup', ${showTerms}, @{/landing})}"></div>
  <div th:replace="~{fragments/auth-parts :: termsDocModal}"></div>
</div>
<div th:replace="~{fragments/common :: hosts}"></div>
<!-- 입력을 시작하면 그 칸의 오류 문구를 지운다 -->
<script th:fragment="clearErrorScript">
  document.addEventListener("input", (e) => {
    if (!e.target.matches("[data-clear-error]")) return;
    e.target.classList.remove("border-[#dc2626]");
    e.target.classList.add("border-[#e2e8f0]");
    const err = e.target.closest("label").querySelector("[data-error]");
    if (err) err.remove();
  });
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-pw-toggle]");
    if (!btn) return;
    const input = btn.parentElement.querySelector("input");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.setAttribute("aria-pressed", String(show));
    btn.setAttribute("aria-label", show ? "비밀번호 숨기기" : "비밀번호 보기");
    btn.querySelector("[data-pw-slash]").style.display = show ? "" : "none";
  });
</script>
</body>
</html>
