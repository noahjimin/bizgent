<!DOCTYPE html>
<!-- 회원가입 (SCR-U-001). 이메일 중복 확인(blur), 비밀번호 강도, 약관 동의를 이 화면에서 받는다. -->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/common :: head('회원가입')}"></head>
<body data-responsive>
<div class="pd-scope flex min-h-screen flex-col items-center justify-center gap-[32px] bg-[#eff6ff] px-[16px] py-[40px] md:py-[72px]">
  <div th:replace="~{fragments/common :: entryBrand(false, false)}"></div>
  <form method="post" th:action="@{/signup}" novalidate data-signup-form
        class="flex w-full max-w-[480px] flex-col gap-[28px] rounded-[24px] bg-white p-[24px] md:p-[40px] shadow-[0px_12px_16px_rgba(15,23,42,0.05)]">
    <div class="text-center">
      <h1 class="text-[34px] leading-[36px] font-extrabold text-[#0f172a]">회원가입</h1>
      <p class="mt-[8px] text-[16px] leading-[22px] font-medium text-[#64748b]">몇 가지 정보만 입력하면 바로 시작할 수 있어요</p>
    </div>
    <div class="flex flex-col gap-[20px]">
      <label th:replace="~{fragments/auth-parts :: authField('이름', 'memberName', 'text', ${memberName}, '이름을 입력하세요 (2~20자)', true, ${errors?.get('memberName')})}"></label>
      <div class="flex flex-col gap-[8px]">
        <label th:replace="~{fragments/auth-parts :: authField('이메일', 'email', 'email', ${email}, '이메일을 입력하세요', true, ${errors?.get('email')})}"></label>
        <p data-email-status role="status" hidden class="text-[13px] font-medium"></p>
      </div>
      <div class="flex flex-col gap-[8px]">
        <label th:replace="~{fragments/auth-parts :: authField('비밀번호', 'password', 'password', '', '영문·숫자 포함 8~20자', true, ${errors?.get('password')})}"></label>
        <!-- 강도 막대: 약함 1칸, 보통 2칸, 강함 3칸이 초록으로 채워진다 -->
        <div data-pw-strength hidden class="flex flex-col gap-[6px]">
          <div class="flex gap-[6px]" aria-hidden="true">
            <span data-pw-bar class="h-[6px] flex-1 rounded-full bg-[#e2e8f0] transition-colors duration-200"></span>
            <span data-pw-bar class="h-[6px] flex-1 rounded-full bg-[#e2e8f0] transition-colors duration-200"></span>
            <span data-pw-bar class="h-[6px] flex-1 rounded-full bg-[#e2e8f0] transition-colors duration-200"></span>
          </div>
          <p role="status" class="text-[13px] font-medium text-[#475569]">
            <span data-pw-level class="font-bold"></span><span data-pw-hint class="text-[#dc2626]"></span>
          </p>
        </div>
      </div>
      <label th:replace="~{fragments/auth-parts :: authField('비밀번호 확인', 'passwordCheck', 'password', '', '비밀번호를 다시 입력하세요', true, ${errors?.get('passwordCheck')})}"></label>
      <label th:replace="~{fragments/auth-parts :: authField('매장명', 'storeName', 'text', ${storeName}, '매장명을 입력하세요', true, ${errors?.get('storeName')})}"></label>
      <div class="flex flex-col gap-[8px]">
        <label th:replace="~{fragments/auth-parts :: authSelect('업종', 'category', ${categories}, ${category}, '업종을 선택하세요', true, ${errors?.get('category')})}"></label>
        <!-- '기타'를 고르면 업종을 직접 입력한다 -->
        <input name="categoryEtc" data-category-etc maxlength="50" th:value="${categoryEtc}" th:hidden="${category != '기타'}"
               placeholder="업종을 직접 입력하세요" aria-label="업종 직접 입력"
               class="h-[56px] w-full rounded-[10px] border border-[#e2e8f0] bg-white px-[16px] font-normal text-[#0f172a] outline-none placeholder:text-[#64748b] focus:border-[#2563eb]">
      </div>
      <label th:replace="~{fragments/auth-parts :: authField('연락처 (선택)', 'phone', 'tel', ${phone}, '010-0000-0000', true, ${errors?.get('phone')})}"></label>
    </div>

    <!-- 약관 동의: 체크는 하나로 받고, 자세히를 누르면 동의 항목과 약관 전문 보기만 펼친다 -->
    <div class="flex flex-col gap-[8px]">
      <div data-agree-box class="rounded-[12px] border"
           th:classappend="${errors?.get('terms') != null ? 'border-[#dc2626]' : 'border-[#e2e8f0]'}">
        <div class="flex items-center gap-[12px] px-[16px] py-[14px]">
          <label class="flex flex-1 cursor-pointer items-center gap-[12px]">
            <input type="checkbox" name="agreeTerms" value="true" th:checked="${agreeTerms}" data-agree class="peer sr-only">
            <th:block th:replace="~{fragments/auth-parts :: checkBox}"></th:block>
            <span class="text-[15px] leading-[1.5] font-medium break-keep text-[#475569]">[필수] 만 14세 이상이며, 이용약관과 개인정보 수집·이용에 모두 동의합니다</span>
          </label>
          <button type="button" data-agree-toggle aria-expanded="false" aria-controls="agree-detail"
                  class="shrink-0 text-[13px] font-bold text-[#475569] underline underline-offset-2 hover:text-[#0f172a]">자세히</button>
        </div>
        <ul id="agree-detail" hidden class="flex flex-col gap-[10px] border-t border-[#f1f5f9] px-[16px] py-[12px] text-[14px] font-medium text-[#475569]">
          <li>만 14세 이상입니다</li>
          <li class="flex items-center justify-between gap-[12px]">이용약관 동의
            <button type="button" data-terms-doc="service" class="text-[13px] font-bold text-[#2563eb] underline underline-offset-2 hover:text-[#1d4ed8]">보기</button></li>
          <li class="flex items-center justify-between gap-[12px]">개인정보 수집·이용 동의
            <button type="button" data-terms-doc="privacy" class="text-[13px] font-bold text-[#2563eb] underline underline-offset-2 hover:text-[#1d4ed8]">보기</button></li>
        </ul>
      </div>
      <span data-agree-error class="text-[13px] font-medium text-[#dc2626]" th:hidden="${errors?.get('terms') == null}"
            th:text="${errors?.get('terms') ?: '필수 약관에 동의해주세요'}">필수 약관에 동의해주세요</span>
    </div>

    <button type="submit" class="btn-primary h-[56px] rounded-[12px] bg-gradient-to-r from-[#2563eb] to-[#1d4ed8] text-[20px] font-bold text-white">가입하기</button>
    <p class="text-center text-[16px] font-medium text-[#64748b]">
      이미 계정이 있으신가요? <a th:href="@{/login}" class="link-hover font-bold text-[#047857]">로그인</a>
    </p>
  </form>
  <div th:replace="~{fragments/auth-parts :: termsDocModal}"></div>
</div>
<div th:replace="~{fragments/common :: hosts}"></div>
<!-- 입력을 시작하면 그 칸의 오류 문구를 지운다 -->
<script th:fragment="clearErrorScript">
  document.addEventListener("input", (e) => {
    if (!e.target.matches("[data-clear-error]")) return;
    e.target.classList.remove("border-[#dc2626]");
    e.target.classList.add("border-[#e2e8f0]");
    const err = e.target.closest("label").querySelector("[data-error]");
    if (err) err.remove();
  });
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-pw-toggle]");
    if (!btn) return;
    const input = btn.parentElement.querySelector("input");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.setAttribute("aria-pressed", String(show));
    btn.setAttribute("aria-label", show ? "비밀번호 숨기기" : "비밀번호 보기");
    btn.querySelector("[data-pw-slash]").style.display = show ? "" : "none";
  });
</script>
<script>
  (() => {
    const form = document.querySelector("[data-signup-form]");

    // 이메일 중복 확인: 칸을 벗어나면 서버에 묻는다. 가입 POST에서도 같은 검사를 다시 한다.
    const email = form.email;
    const emailStatus = form.querySelector("[data-email-status]");
    const EMAIL_MESSAGES = {
      ok: ["사용할 수 있는 이메일입니다", "text-[#047857]"],
      taken: ["이미 가입된 이메일입니다", "text-[#dc2626]"],
      invalid: ["이메일 형식을 확인해주세요", "text-[#dc2626]"],
    };
    email.addEventListener("input", () => (emailStatus.hidden = true));
    email.addEventListener("blur", async () => {
      const value = email.value.trim();
      emailStatus.hidden = true;
      if (!value) return;
      try {
        const res = await fetch("/api/auth/email-check?email=" + encodeURIComponent(value));
        if (!res.ok) return;
        const [text, color] = EMAIL_MESSAGES[(await res.json()).status];
        email.closest("label").querySelector("[data-error]")?.remove();
        emailStatus.className = "text-[13px] font-medium " + color;
        emailStatus.textContent = text;
        emailStatus.hidden = false;
      } catch {
        // 확인하지 못하면 안내 없이 둔다. 가입할 때 서버가 다시 검사한다.
      }
    });

    // 비밀번호 강도: 규칙(8~20자, 영문·숫자 포함)은 MemberService.passwordProblem과 같다.
    const password = form.password;
    const meter = form.querySelector("[data-pw-strength]");
    const bars = Array.from(meter.querySelectorAll("[data-pw-bar]"));
    const levelText = meter.querySelector("[data-pw-level]");
    const hint = meter.querySelector("[data-pw-hint]");
    const problem = (pw) =>
      pw.length < 8 || pw.length > 20 ? "8~20자로 입력해주세요"
        : !/[A-Za-z]/.test(pw) ? "영문을 포함해주세요"
        : !/\d/.test(pw) ? "숫자를 포함해주세요" : null;
    const strength = (pw) => (problem(pw) ? 1 : /[^A-Za-z0-9]/.test(pw) && pw.length >= 12 ? 3 : 2);
    const renderStrength = () => {
      const pw = password.value;
      meter.hidden = pw === "";
      const level = strength(pw);
      bars.forEach((bar, i) => {
        bar.classList.toggle("bg-[#10b981]", i < level);
        bar.classList.toggle("bg-[#e2e8f0]", i >= level);
      });
      levelText.textContent = ["", "약함", "보통", "강함"][level];
      levelText.className = "font-bold " + (level === 1 ? "text-[#dc2626]" : "text-[#047857]");
      hint.textContent = level === 1 ? " · " + problem(pw) : "";
    };
    password.addEventListener("input", renderStrength);

    const categoryEtc = form.querySelector("[data-category-etc]");
    form.category.addEventListener("change", () => {
      categoryEtc.hidden = form.category.value !== "기타";
      if (!categoryEtc.hidden) categoryEtc.focus();
    });

    // 약관 동의 상세 펼치기 (체크 상태는 바꾸지 않는다)
    const toggle = form.querySelector("[data-agree-toggle]");
    const detail = form.querySelector("#agree-detail");
    toggle.addEventListener("click", () => {
      detail.hidden = !detail.hidden;
      toggle.setAttribute("aria-expanded", String(!detail.hidden));
      toggle.textContent = detail.hidden ? "자세히" : "접기";
    });
    const agree = form.agreeTerms;
    const agreeBox = form.querySelector("[data-agree-box]");
    const agreeError = form.querySelector("[data-agree-error]");
    const setAgreeError = (show) => {
      agreeError.hidden = !show;
      agreeBox.classList.toggle("border-[#dc2626]", show);
      agreeBox.classList.toggle("border-[#e2e8f0]", !show);
    };
    agree.addEventListener("change", () => agree.checked && setAgreeError(false));

    // 비밀번호가 약함이거나 동의하지 않았으면 제출하지 않는다.
    form.addEventListener("submit", (e) => {
      let first = null;
      if (problem(password.value)) {
        renderStrength();
        meter.hidden = false;
        first = password;
      }
      if (!agree.checked) {
        setAgreeError(true);
        first = first || agree;
      }
      if (first) {
        e.preventDefault();
        first.focus();
      }
    });
  })();
</script>
</body>
</html>
