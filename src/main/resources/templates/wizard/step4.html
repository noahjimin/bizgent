<!DOCTYPE html>
<!-- 캠페인 생성 4단계: 시안 비교 (F06, F16). A/B 시안 비교·복수 선택, 수정하기 모달, 이미지 다운로드 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layout/wizard :: layout('시안 비교', ~{::content}, ~{::scripts})}">
<body>
<th:block th:fragment="content">
<form id="step-form" method="post" th:action="@{/campaigns/new/4}" class="flex flex-1 flex-col" data-compare-form
      th:with="note=${draft.content.customChannelNote}, hasDrafts=${!draft.drafts.isEmpty()}">
  <input type="hidden" name="selectedKeys" th:value="${#strings.listJoin(draft.selectedDraftKeys, ',')}" data-selected>

  <div class="flex flex-1 flex-col items-center gap-[18px] px-[70px] pt-[26px] pb-[20px]">
    <div class="flex w-full max-w-[1000px] flex-col items-center gap-[8px] text-center">
      <span class="flex items-center gap-[6px] rounded-full bg-[#ddf8f3] px-[11px] py-[6px]">
        <img alt="" th:src="@{/assets/831ac.svg}" class="size-[14px]">
        <span class="f-bold whitespace-pre text-[14px] text-[#14b8a6]">4 단계</span>
      </span>
      <h1 class="f-bold text-[34px] text-[#172033]">마음에 드는 시안을 선택해주세요</h1>
      <p class="f-regular text-[18px] leading-[1.5] text-[#667085]">무료·구독 모두 A/B 2가지 시안을 비교하고, 여러 개를 함께 게시할 수 있어요</p>
    </div>

    <div th:unless="${hasDrafts}" class="w-full max-w-[1000px]">
      <div th:replace="~{fragments/wizard-parts :: loading('AI가 시안을 만들고 있어요', '기획 내용과 채널에 맞춰 문구와 이미지를 준비 중이에요')}"></div>
    </div>

    <div th:if="${hasDrafts}" class="flex w-full max-w-[1000px] items-start gap-[24px]">
      <article th:each="d : ${draft.drafts}" data-draft-card th:attr="data-key=${d.key}"
               class="flex h-[536px] min-w-0 flex-1 flex-col overflow-hidden rounded-[18px] border-2 border-[#e5eaf1] bg-white shadow-[0px_5px_16px_0px_rgba(16,24,40,0.05)]">
        <div class="relative h-[228px] w-full shrink-0 bg-[#eef1f5]">
          <img data-draft-image th:alt="|시안 ${d.key} 광고 이미지|" th:src="${d.imageUrl}" th:hidden="${#strings.isEmpty(d.imageUrl)}" class="absolute inset-0 size-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-b from-[rgba(23,32,51,0.04)] to-[rgba(23,32,51,0.2)]"></div>
          <span class="f-bold absolute top-[16px] left-[16px] rounded-full bg-white px-[12px] py-[7px] text-[14px] text-[#172033] shadow-[0px_3px_10px_0px_rgba(16,24,40,0.1)]" th:text="|시안 ${d.key}|"></span>
          <span data-selected-mark hidden class="absolute top-[16px] right-[60px] size-[30px]" aria-label="선택됨">
            <span class="absolute inset-[-16.67%_-26.67%_-36.67%_-26.67%]"><img alt="" th:src="@{/assets/80cca.svg}" class="block size-full max-w-none"></span>
          </span>
          <button type="button" data-download th:hidden="${#strings.isEmpty(d.imageUrl)}" th:aria-label="|시안 ${d.key} 이미지 다운로드|" class="absolute top-[12px] right-[12px] size-[36px]">
            <span class="absolute inset-[-22.22%_-33.33%_-44.44%_-33.33%]"><img alt="" th:src="@{/assets/9a7d7.svg}" class="block size-full max-w-none"></span>
          </button>
        </div>
        <div class="flex min-h-0 w-full flex-1 flex-col gap-[12px] px-[20px] py-[18px]">
          <div class="f-semibold flex w-full flex-col gap-[12px]">
            <p class="w-full text-[13px] text-[#667085]" th:text="${@fmt.channelLabel(d.channel, note, '용')}"></p>
            <p data-draft-text class="w-full text-[16px] leading-[1.55] text-[#172033]" th:text="${d.text}"></p>
            <p data-draft-tags class="w-full text-[14px] leading-[1.5] text-[#2563eb]" th:text="${d.hashtagText}" th:hidden="${d.hashtags.isEmpty()}"></p>
          </div>
          <div class="min-h-0 w-full flex-1"></div>
          <div class="flex w-full flex-wrap items-center gap-[10px]">
            <button type="button" data-edit class="flex h-[44px] items-center gap-[8px] rounded-full border border-[#d0d7e2] bg-white px-[16px] hover:bg-[#f7f9fc]">
              <img alt="" th:src="@{/assets/3179d.svg}" class="size-[18px]">
              <span class="f-semibold text-[16px] whitespace-nowrap text-[#667085]">수정하기</span>
            </button>
            <button type="button" data-select aria-pressed="false"
                    class="flex h-[44px] items-center gap-[8px] rounded-full border border-[#2563eb] bg-[#2563eb] px-[16px] shadow-[0px_10px_24px_0px_rgba(37,99,235,0.14)] hover:bg-[#1d4ed8]">
              <span class="relative size-[16px]"><span class="absolute inset-[-6.88%_-6.88%_-12.14%_-6.88%]"><img alt="" th:src="@{/assets/c167f.svg}" class="block size-full max-w-none"></span></span>
              <span data-select-label class="f-bold text-[16px] whitespace-nowrap text-white">게시할 시안으로 선택</span>
            </button>
          </div>
        </div>
      </article>
    </div>
  </div>

  <footer class="sticky bottom-0 z-10 flex h-[88px] shrink-0 items-center justify-center border-t border-[#e5eaf1] bg-white px-[70px]">
    <div class="flex w-full max-w-[1000px] items-center justify-between">
      <div class="flex items-center gap-[12px]">
        <span data-selection-badge hidden class="flex items-center gap-[6px] rounded-full bg-[#eff5ff] px-[12px] py-[7px]">
          <img alt="" th:src="@{/assets/df502.svg}" class="size-[16px]">
          <span data-selection-label class="f-semibold text-[14px] whitespace-nowrap text-[#1d4ed8]"></span>
        </span>
        <button type="button" data-confirm-next data-next-button disabled data-confirm-title="게시 단계로 넘어갈까요?"
                class="flex h-[56px] items-center rounded-full border border-[#2563eb] bg-[#2563eb] px-[24px] shadow-[0px_10px_24px_0px_rgba(37,99,235,0.14)] hover:bg-[#1d4ed8] disabled:cursor-not-allowed disabled:opacity-40">
          <span class="f-bold text-[16px] whitespace-nowrap text-white">다음: 게시하기</span>
        </button>
      </div>
    </div>
  </footer>
</form>

<!-- 시안 수정 모달 -->
<div id="draft-edit-modal" data-modal data-backdrop-close role="presentation" hidden
     class="fixed inset-0 z-50 flex items-center justify-center bg-[rgba(23,32,51,0.4)]">
  <div role="dialog" aria-modal="true" aria-labelledby="draft-edit-title"
       class="flex h-[720px] max-h-[calc(100vh-32px)] w-[960px] max-w-[calc(100vw-32px)] flex-col gap-[20px] rounded-[20px] border border-[#e5eaf1] bg-white p-[24px] drop-shadow-[0px_18px_20px_rgba(16,24,40,0.1)]">
    <div class="flex w-full items-center justify-between">
      <div class="flex min-w-0 flex-1 flex-col gap-[6px]">
        <h2 id="draft-edit-title" class="f-bold text-[28px] text-[#172033]">시안 수정</h2>
        <p class="f-regular text-[15px] leading-[1.5] text-[#667085]">문구와 이미지를 직접 고칠 수 있어요.</p>
      </div>
      <button type="button" data-modal-close aria-label="닫기" class="flex size-[36px] shrink-0 items-center justify-center rounded-full border border-[#e5eaf1] bg-[#f7f9fc] hover:bg-[#eef1f5]">
        <img alt="" th:src="@{/assets/d0027.svg}" class="size-[18px]">
      </button>
    </div>

    <div class="flex min-h-0 w-full flex-1 items-start gap-[24px] overflow-y-auto">
      <div class="flex w-[420px] shrink-0 flex-col gap-[12px]">
        <div class="relative h-[320px] w-full overflow-hidden rounded-[16px] bg-[#eef1f5]">
          <img data-edit-image alt="" class="size-full rounded-[16px] object-cover">
          <div data-image-busy hidden class="absolute inset-0 flex items-center justify-center bg-white/60">
            <span class="size-[32px] animate-spin rounded-full border-4 border-[#eaf2ff] border-t-[#2563eb]"></span>
          </div>
          <button type="button" data-edit-download aria-label="이미지 다운로드" class="absolute top-[12px] right-[12px] flex size-[36px] items-center justify-center rounded-full bg-white drop-shadow-[0px_4px_6px_rgba(16,24,40,0.1)]">
            <img alt="" th:src="@{/assets/9fa09.svg}" class="size-[18px]">
          </button>
        </div>
        <div th:unless="${me.free}" class="flex w-full flex-col gap-[8px] rounded-[14px] border border-[#e5eaf1] bg-[#f7f9fc] px-[14px] py-[12px]">
          <p class="f-bold text-[14px] text-[#172033]">AI로 이미지 수정하기</p>
          <div class="flex gap-[8px]">
            <input data-instruction placeholder="예: 배경을 더 밝게 해주세요" aria-label="이미지 수정 방향"
                   class="f-regular h-[40px] min-w-0 flex-1 rounded-[10px] border border-[#d0d7e2] bg-white px-[12px] text-[14px] outline-none focus:border-[#2563eb]">
            <button type="button" data-image-edit disabled class="f-bold h-[40px] shrink-0 rounded-full bg-[#2563eb] px-[14px] text-[13px] text-white disabled:opacity-40">수정하기</button>
          </div>
        </div>
        <th:block th:if="${me.free}"><button th:replace="~{:: lockedCard('AI로 이미지 수정하기', '수정하고 싶은 방향을 적으면 AI가 이미지를 다시 만들어줘요.', 'AI 이미지 수정')}"></button></th:block>
      </div>

      <div class="flex min-w-0 flex-1 flex-col gap-[16px]">
        <div class="flex w-full flex-col gap-[8px]">
          <label for="draft-text" class="f-bold text-[14px] text-[#172033]">홍보 문구</label>
          <textarea id="draft-text" maxlength="300" data-edit-text
                    class="f-regular h-[140px] w-full resize-none rounded-[14px] border border-[#e5eaf1] bg-white p-[16px] text-[15px] leading-[1.55] text-[#172033] outline-none focus:border-[#2563eb]"></textarea>
          <div class="flex w-full items-center justify-between text-[13px]">
            <p class="f-regular text-[#667085]">문구를 수정해 보세요</p>
            <p class="f-bold text-[#2563eb]" data-text-count>0/300</p>
          </div>
        </div>
        <div class="flex w-full flex-col gap-[10px]">
          <p class="f-bold text-[14px] text-[#172033]">해시태그</p>
          <div class="flex w-full flex-wrap items-start gap-[8px]" data-edit-tags>
            <button type="button" data-tag-add class="f-bold flex items-center rounded-full border border-[#2563eb] bg-[#eff5ff] px-[12px] py-[8px] text-[13px] whitespace-nowrap text-[#2563eb]">+ 해시태그 추가</button>
            <input hidden data-tag-input placeholder="#해시태그" aria-label="해시태그 입력"
                   class="f-semibold h-[35px] w-[140px] rounded-full border border-[#2563eb] bg-white px-[12px] text-[13px] outline-none">
          </div>
        </div>
        <div th:unless="${me.free}" class="flex w-full flex-col gap-[8px] rounded-[14px] border border-[#e5eaf1] bg-[#f7f9fc] px-[14px] py-[12px]" data-alternatives>
          <div class="flex items-center justify-between">
            <p class="f-bold text-[14px] text-[#172033]">AI 문구 대안 보기</p>
            <button type="button" data-alt-load class="f-bold rounded-full bg-[#2563eb] px-[12px] py-[6px] text-[12px] text-white disabled:opacity-40">제안받기</button>
          </div>
          <div data-alt-list class="flex w-full flex-col gap-[8px]">
            <p class="f-regular text-[13px] text-[#667085]">AI가 다른 표현을 3가지 제안해줘요.</p>
          </div>
        </div>
        <th:block th:if="${me.free}"><button th:replace="~{:: lockedCard('AI 문구 대안 보기', 'AI가 다른 표현을 3가지 제안해줘요.', 'AI 문구 대안')}"></button></th:block>
      </div>
    </div>

    <div class="flex w-full items-center justify-between border-t border-[#e5eaf1] pt-[16px]">
      <button type="button" data-modal-close class="f-bold flex h-[44px] items-center rounded-full border border-[#d0d7e2] bg-white px-[20px] text-[15px] text-[#667085]">취소</button>
      <button type="button" data-edit-save class="f-bold flex h-[44px] items-center rounded-full border border-[#2563eb] bg-[#2563eb] px-[24px] text-[15px] text-white drop-shadow-[0px_10px_12px_rgba(37,99,235,0.14)] hover:bg-[#1d4ed8] disabled:opacity-40">저장하기</button>
    </div>
  </div>
</div>
</th:block>

<button th:fragment="lockedCard(title, desc, feature)" type="button" th:attr="data-upgrade-feature-name=${feature}"
        class="flex w-full items-center gap-[10px] rounded-[14px] border border-[#e5eaf1] bg-[#f7f9fc] px-[14px] py-[12px] text-left">
  <span class="flex size-[32px] shrink-0 items-center justify-center rounded-full border border-[#e5eaf1] bg-white"><img alt="" th:src="@{/assets/d3905.svg}" class="size-[16px]"></span>
  <span class="flex min-w-0 flex-1 flex-col gap-[4px]">
    <span class="flex w-full items-center gap-[8px]">
      <span class="f-bold text-[14px] whitespace-nowrap text-[#172033]" th:text="${title}"></span>
      <span class="f-bold rounded-full bg-[#ddf8f3] px-[10px] py-[4px] text-[12px] whitespace-nowrap text-[#14b8a6]">구독 전용</span>
    </span>
    <span class="f-regular w-full text-[13px] leading-[1.4] text-[#667085]" th:text="${desc}"></span>
  </span>
</button>

<th:block th:fragment="scripts">
<script th:inline="javascript">
  const HAS_DRAFTS = /*[[${!draft.drafts.isEmpty()}]]*/ false;
  const DRAFTS = /*[[${draft.drafts}]]*/ [];
  const TAG_REMOVE_ICON = /*[[@{/assets/537c6.svg}]]*/ "";
</script>
<script>
(() => {
  if (!HAS_DRAFTS) {
    Promise.all([BG.postJson("/api/wizard/drafts"), new Promise((r) => setTimeout(r, 1500))])
      .then(() => location.reload())
      .catch(() => BG.toast("시안을 만들지 못했어요. 새로고침해 주세요"));
    return;
  }

  const form = document.querySelector("[data-compare-form]");
  const selectedInput = form.querySelector("[data-selected]");
  const order = DRAFTS.map((d) => d.key);
  let selected = selectedInput.value.split(",").filter(Boolean);

  /* 선택 */
  const renderSelection = () => {
    selected = order.filter((k) => selected.includes(k));
    selectedInput.value = selected.join(",");
    form.querySelectorAll("[data-draft-card]").forEach((card) => {
      const on = selected.includes(card.dataset.key);
      card.classList.toggle("border-[#2563eb]", on);
      card.classList.toggle("shadow-[0px_10px_28px_0px_rgba(37,99,235,0.12)]", on);
      card.classList.toggle("border-[#e5eaf1]", !on);
      card.classList.toggle("shadow-[0px_5px_16px_0px_rgba(16,24,40,0.05)]", !on);
      card.querySelector("[data-selected-mark]").hidden = !on;
      card.querySelector("[data-select]").setAttribute("aria-pressed", String(on));
      card.querySelector("[data-select-label]").textContent = on ? "선택됨" : "게시할 시안으로 선택";
    });
    const badge = form.querySelector("[data-selection-badge]");
    badge.hidden = !selected.length;
    form.querySelector("[data-selection-label]").textContent =
      selected.length > 1 ? `시안 ${selected.join(", ")} 선택됨 (${selected.length}개 게시)` : `시안 ${selected[0] || ""} 선택됨`;
    const next = form.querySelector("[data-next-button]");
    next.disabled = !selected.length;
    next.dataset.confirmBody = `선택한 시안 ${selected.length}개로 게시 단계로 넘어가요. 시안 선택과 수정 내용은 이후 변경할 수 없어요.`;
  };

  form.addEventListener("click", (e) => {
    const card = e.target.closest("[data-draft-card]");
    if (!card) return;
    const key = card.dataset.key;
    if (e.target.closest("[data-select]")) {
      selected = selected.includes(key) ? selected.filter((k) => k !== key) : [...selected, key];
      renderSelection();
    }
    if (e.target.closest("[data-download]")) BG.downloadImage(DRAFTS.find((d) => d.key === key).imageUrl, `bizgent_시안${key}.png`);
    if (e.target.closest("[data-edit]")) openEditor(key);
  });

  /* 수정 모달 */
  const modal = document.getElementById("draft-edit-modal");
  const $ = (s) => modal.querySelector(s);
  let editing = null; // {key, text, hashtags, imageUrl}

  const renderTags = () => {
    const box = $("[data-edit-tags]");
    box.querySelectorAll("[data-tag]").forEach((t) => t.remove());
    editing.hashtags.forEach((t) => {
      const chip = document.createElement("span");
      chip.dataset.tag = t;
      chip.className = "flex items-center gap-[6px] rounded-full border border-[#e5eaf1] bg-white py-[8px] pr-[10px] pl-[12px]";
      chip.innerHTML = `<span class="f-semibold text-[13px] whitespace-nowrap text-[#172033]"></span><button type="button" data-tag-remove><img alt="" src="${TAG_REMOVE_ICON}" class="size-[14px]"></button>`;
      chip.querySelector("span").textContent = "#" + t;
      chip.querySelector("button").setAttribute("aria-label", `#${t} 삭제`);
      $("[data-tag-add]").before(chip);
    });
  };
  const setImage = (url) => {
    editing.imageUrl = url;
    $("[data-edit-image]").src = url || "";
    $("[data-edit-image]").hidden = !url;
  };

  function openEditor(key) {
    const d = DRAFTS.find((x) => x.key === key);
    editing = { key, text: d.text, hashtags: [...d.hashtags], imageUrl: d.imageUrl, channel: d.channel };
    $("#draft-edit-title").textContent = `시안 ${key} 수정`;
    $("[data-edit-text]").value = d.text;
    $("[data-text-count]").textContent = `${d.text.length}/300`;
    setImage(d.imageUrl);
    renderTags();
    const list = $("[data-alt-list]");
    if (list) {
      list.innerHTML = '<p class="f-regular text-[13px] text-[#667085]">AI가 다른 표현을 3가지 제안해줘요.</p>';
      $("[data-alt-load]").textContent = "제안받기";
    }
    BG.openModal("draft-edit-modal");
  }

  $("[data-edit-text]").addEventListener("input", (e) => {
    editing.text = e.target.value;
    $("[data-text-count]").textContent = `${e.target.value.length}/300`;
    modal.querySelectorAll("[data-alt]").forEach((b) => b.classList.toggle("border-[#2563eb]", b.textContent === editing.text));
  });
  $("[data-edit-tags]").addEventListener("click", (e) => {
    const remove = e.target.closest("[data-tag-remove]");
    if (remove) { editing.hashtags = editing.hashtags.filter((t) => t !== remove.closest("[data-tag]").dataset.tag); renderTags(); }
    if (e.target.closest("[data-tag-add]")) { $("[data-tag-add]").hidden = true; $("[data-tag-input]").hidden = false; $("[data-tag-input]").focus(); }
  });
  const tagInput = $("[data-tag-input]");
  const addTag = () => {
    const v = tagInput.value.trim().replace(/^#/, "");
    tagInput.value = "";
    tagInput.hidden = true;
    $("[data-tag-add]").hidden = false;
    if (v && !editing.hashtags.includes(v)) { editing.hashtags.push(v); renderTags(); }
  };
  tagInput.addEventListener("blur", addTag);
  tagInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); tagInput.blur(); } });
  $("[data-edit-download]").addEventListener("click", () => BG.downloadImage(editing.imageUrl, `bizgent_시안${editing.key}.png`));

  // 구독: AI 문구 대안
  const altLoad = $("[data-alt-load]");
  if (altLoad) altLoad.addEventListener("click", async () => {
    altLoad.disabled = true;
    altLoad.textContent = "제안 중...";
    const [alts] = await Promise.all([BG.postJson(`/api/wizard/drafts/${editing.key}/alternatives`, { text: editing.text }), new Promise((r) => setTimeout(r, 1200))]);
    const list = $("[data-alt-list]");
    list.innerHTML = "";
    alts.forEach((alt) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.alt = "";
      b.className = "f-regular w-full rounded-[10px] border border-[#e5eaf1] bg-white px-[12px] py-[10px] text-left text-[13px] leading-[1.5] text-[#172033] hover:border-[#c7d2e2]";
      b.textContent = alt;
      b.addEventListener("click", () => {
        editing.text = alt.slice(0, 300);
        $("[data-edit-text]").value = editing.text;
        $("[data-edit-text]").dispatchEvent(new Event("input"));
      });
      list.appendChild(b);
    });
    altLoad.disabled = false;
    altLoad.textContent = "다시 제안받기";
  });

  // 구독: AI 이미지 수정
  const instruction = $("[data-instruction]");
  if (instruction) {
    const btn = $("[data-image-edit]");
    instruction.addEventListener("input", () => (btn.disabled = !instruction.value.trim()));
    const run = async () => {
      if (!instruction.value.trim()) return;
      btn.disabled = true;
      $("[data-image-busy]").hidden = false;
      $("[data-edit-save]").disabled = true;
      const [res] = await Promise.all([
        BG.postJson(`/api/wizard/drafts/${editing.key}/image`, { imageUrl: editing.imageUrl, instruction: instruction.value.trim() }),
        new Promise((r) => setTimeout(r, 1500)),
      ]);
      setImage(res.imageUrl);
      instruction.value = "";
      $("[data-image-busy]").hidden = true;
      $("[data-edit-save]").disabled = false;
    };
    btn.addEventListener("click", run);
    instruction.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); run(); } });
  }

  // 저장: 서버에 반영하고 카드도 바로 바꾼다.
  $("[data-edit-save]").addEventListener("click", async () => {
    const saved = await BG.postJson(`/api/wizard/drafts/${editing.key}`, { text: editing.text, hashtags: editing.hashtags, imageUrl: editing.imageUrl });
    const i = DRAFTS.findIndex((d) => d.key === saved.key);
    DRAFTS[i] = saved;
    const card = form.querySelector(`[data-draft-card][data-key="${saved.key}"]`);
    card.querySelector("[data-draft-text]").textContent = saved.text;
    const tags = card.querySelector("[data-draft-tags]");
    tags.textContent = saved.hashtags.map((t) => "#" + t).join(" ");
    tags.hidden = !saved.hashtags.length;
    const img = card.querySelector("[data-draft-image]");
    img.src = saved.imageUrl || "";
    img.hidden = !saved.imageUrl;
    BG.closeModal(modal);
    BG.toast(`시안 ${saved.key}을 저장했어요`);
  });

  renderSelection();
})();
</script>
</th:block>
</body>
</html>
