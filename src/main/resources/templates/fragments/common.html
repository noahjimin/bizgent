<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<!-- 모든 화면이 공유하는 조각 -->

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' | BizGent'">BizGent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/vendor/tailwindcss-browser.js}"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-brand-50: #eff6ff;
      --color-brand-100: #dbeafe;
      --color-brand-600: #2563eb;
      --color-brand-700: #1d4ed8;
      --color-mint-50: #f0fdfa;
      --color-mint-500: #14b8a6;
      --color-ink-950: #111827;
      --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    }
  </style>
  <script th:src="@{/js/app.js}"></script>
</head>

<!-- 24px 라인 아이콘 -->
<svg th:fragment="icon(name, size, sw)" viewBox="0 0 24 24" th:width="${size}" th:height="${size}" fill="none"
     stroke="currentColor" th:attr="stroke-width=${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path th:with="iconPath=${@icons.path(name)}" th:d="${iconPath}"/>
</svg>

<!-- 로고 (진입 화면용) -->
<div th:fragment="entryBrand(light, large)" class="flex items-center gap-[12px]">
  <span class="flex size-[40px] shrink-0 items-center justify-center rounded-[12px] bg-[conic-gradient(from_200deg,#59c773,#46b0b3,#3399f2,#909f93,#eda633,#c1ccc2,#b2d9f2,#59c773)]">
    <img alt="" th:src="@{/assets/97a48.svg}" class="size-[20px]">
  </span>
  <span class="font-bold whitespace-nowrap"
        th:classappend="${(large ? 'text-[30px] ' : 'text-[20px] ') + (light ? 'text-white' : 'text-[#0f172a]')}">BizGent</span>
</div>

<!-- 로고 마크 (사이드바·위자드용) -->
<span th:fragment="logoMark(sizeClass, textClass)"
      class="flex items-center justify-center overflow-clip font-bold text-white bg-[#2563eb] bg-[conic-gradient(from_200deg,#59c773,#46b0b3,#3399f2,#909f93,#eda633,#c1ccc2,#b2d9f2,#59c773)]"
      th:classappend="${sizeClass + ' ' + textClass}">B</span>

<!-- 화면 공통 호스트: 토스트, 확인 팝업, 구독 전용 안내 -->
<div th:fragment="hosts">
  <div id="toast" role="status" hidden
       class="fixed bottom-[40px] left-1/2 z-[80] flex -translate-x-1/2 items-center gap-[8px] rounded-full bg-[#172033] px-[18px] py-[11px] shadow-[0px_10px_24px_0px_rgba(16,24,40,0.18)]">
    <span class="flex size-[18px] items-center justify-center rounded-full bg-[#2563eb]">
      <img alt="" th:src="@{/assets/a244b.svg}" class="size-[11px]">
    </span>
    <p data-toast-message class="f-semibold text-[14px] whitespace-nowrap text-white"></p>
  </div>

  <div id="upgrade-hint" role="status" hidden
       class="fixed bottom-[108px] left-1/2 z-[60] flex -translate-x-1/2 items-center gap-[10px] rounded-full border border-[#e5eaf1] bg-white px-[18px] py-[10px] shadow-[0px_10px_24px_0px_rgba(16,24,40,0.12)]">
    <span class="f-bold rounded-full bg-[#ddf8f3] px-[8px] py-[3px] text-[11px] text-[#14b8a6]">구독 전용</span>
    <p class="f-regular text-[13px] whitespace-nowrap text-[#667085]">
      <span data-upgrade-feature></span>은(는) 구독 플랜에서 사용할 수 있어요 ·
      <a th:href="@{/subscription}" class="f-bold text-[#2563eb] hover:underline">요금제 보기</a>
    </p>
  </div>

  <div id="confirm-dialog" role="presentation" hidden data-backdrop-close
       class="fixed inset-0 z-[70] flex items-center justify-center bg-[#172033]/35">
    <div role="alertdialog" aria-modal="true" aria-labelledby="confirm-dialog-message"
         class="flex w-[400px] flex-col gap-[24px] rounded-[20px] border border-[#e5eaf1] bg-white p-[28px] shadow-[0px_20px_48px_0px_rgba(16,24,40,0.18)]">
      <p id="confirm-dialog-message" class="f-bold text-[18px] leading-[1.45] text-[#172033]"></p>
      <div class="flex justify-end gap-[10px]">
        <button type="button" data-confirm-cancel class="f-bold flex h-[44px] items-center rounded-full border border-[#d0d7e2] bg-white px-[20px] text-[15px] text-[#667085] hover:bg-[#f7f9fc]">취소</button>
        <button type="button" data-confirm-ok class="f-bold flex h-[44px] items-center rounded-full border border-[#2563eb] bg-[#2563eb] px-[24px] text-[15px] text-white hover:bg-[#1d4ed8]">확인</button>
      </div>
    </div>
  </div>

  <span hidden data-flash-toast th:if="${toast != null}" th:text="${toast}"></span>
</div>

</html>
