<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<!-- 로그인 전 화면 조각 -->

<!-- 체크박스 모양 (바로 앞의 peer 체크박스 상태를 따른다) -->
<th:block th:fragment="checkBox">
  <span class="size-[24px] shrink-0 rounded-[6px] border-2 border-[#cbd5e1] bg-white peer-checked:hidden"></span>
  <span class="hidden size-[24px] shrink-0 items-center justify-center rounded-[6px] bg-[#2563eb] transition-colors peer-checked:flex">
    <svg viewBox="0 0 24 24" fill="none" class="size-[16px]" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
</th:block>

<!--
  이용약관 동의 카드 (SCR-U-001-P01)
  next: 동의 후 이동할 화면(/login 또는 /signup), open: 처음부터 열지 여부, cancelUrl: 취소 시 이동 경로(없으면 닫기만)
-->
<div th:fragment="termsModal(next, open, cancelUrl)" id="terms-modal" data-modal th:hidden="${!open}"
     th:attr="data-cancel-url=${cancelUrl}"
     class="pd-scope fixed inset-0 z-50 flex items-center justify-center bg-[rgba(15,23,42,0.5)] backdrop-blur-[8px]">
  <form method="post" th:action="@{/terms/agree}" role="dialog" aria-modal="true" aria-labelledby="terms-title" data-terms-form
        class="relative flex h-[580px] w-[900px] overflow-hidden rounded-[24px] bg-white shadow-[0px_24px_48px_0px_rgba(15,23,42,0.25)]">
    <input type="hidden" name="intent" value="start">
    <input type="hidden" name="next" th:value="${next}">
    <button type="button" aria-label="취소" data-terms-cancel
            class="absolute top-[24px] right-[24px] z-10 flex size-[40px] items-center justify-center rounded-[20px] bg-[#f1f5f9] transition-colors duration-150 hover:bg-[#e2e8f0]">
      <img alt="" th:src="@{/assets/9c9d5.svg}" class="size-[16px]">
    </button>

    <div class="flex h-full w-[495px] flex-col justify-between p-[40px]">
      <div class="flex flex-col gap-[32px]">
        <div class="flex flex-col gap-[8px]">
          <h2 id="terms-title" class="text-[28px] font-extrabold text-[#0f172a]">이용약관</h2>
          <p class="text-[14px] font-medium text-[#94a3b8]">서비스 이용을 위해 아래 약관에 동의해 주세요.</p>
        </div>

        <div>
          <label class="flex cursor-pointer items-center gap-[12px] border-b-2 border-[#e2e8f0] py-[16px]">
            <input type="checkbox" data-terms-all class="peer sr-only">
            <th:block th:replace="~{fragments/auth-parts :: checkBox}"></th:block>
            <span class="text-[18px] font-bold text-[#0f172a]">전체 동의</span>
          </label>
          <label class="flex cursor-pointer items-center gap-[12px] border-b border-[#f1f5f9] py-[14px]">
            <input type="checkbox" data-terms-item class="peer sr-only">
            <th:block th:replace="~{fragments/auth-parts :: checkBox}"></th:block>
            <span class="flex-1 text-[15px] font-medium text-[#475569]">만 14세 이상입니다 (필수)</span>
          </label>
          <label class="flex cursor-pointer items-center gap-[12px] border-b border-[#f1f5f9] py-[14px]">
            <input type="checkbox" data-terms-item class="peer sr-only">
            <th:block th:replace="~{fragments/auth-parts :: checkBox}"></th:block>
            <span class="flex-1 text-[15px] font-medium text-[#475569]"><span class="text-[#2563eb] underline">이용약관</span>에 동의합니다 (필수)</span>
          </label>
          <label class="flex cursor-pointer items-center gap-[12px] border-b border-[#f1f5f9] py-[14px]">
            <input type="checkbox" data-terms-item class="peer sr-only">
            <th:block th:replace="~{fragments/auth-parts :: checkBox}"></th:block>
            <span class="flex-1 text-[15px] font-medium text-[#475569]">개인정보 수집 및 이용에 동의합니다 (필수)</span>
            <span class="text-[13px] font-bold text-[#94a3b8] underline">더보기</span>
          </label>
        </div>
      </div>

      <button type="submit" disabled data-terms-submit
              class="btn-primary flex h-[54px] w-full items-center justify-center rounded-[12px] bg-[#2563eb] text-[18px] font-bold text-white disabled:cursor-not-allowed disabled:bg-[#cbd5e1]">
        동의 및 계속하기
      </button>
    </div>

    <div class="flex h-full w-[405px] flex-col items-center justify-center bg-gradient-to-r from-[#2563eb] to-[#14b8a6]">
      <div class="relative size-[320px]">
        <img alt="" th:src="@{/assets/d1f73.svg}" class="absolute top-1/2 left-1/2 size-[200px] -translate-x-1/2 -translate-y-1/2">
        <img alt="" th:src="@{/assets/d2552.svg}" class="absolute top-1/2 left-1/2 size-[140px] -translate-x-1/2 -translate-y-1/2">
        <span class="absolute top-1/2 left-1/2 flex size-[90px] -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white shadow-[0px_8px_12px_rgba(15,23,42,0.15)]">
          <span class="flex size-[48px] items-center justify-center rounded-[14px] bg-gradient-to-br from-[#59c773] via-[#3399f2] to-[#eda633]">
            <img alt="" th:src="@{/assets/ea787.svg}" class="size-[24px]">
          </span>
        </span>
        <span th:each="f : ${ { {'top-[45px] left-[45px]', '8e2d4.svg'}, {'top-[50px] left-[235px]', 'e5e9d.svg'}, {'top-[170px] left-[20px]', 'ccd45.svg'}, {'top-[190px] left-[245px]', '1216c.svg'}, {'top-[255px] left-[138px]', '4228c.svg'} } }"
              class="absolute flex size-[44px] items-center justify-center rounded-full bg-white shadow-[0px_4px_6px_rgba(15,23,42,0.12)]"
              th:classappend="${f[0]}">
          <img alt="" th:src="@{'/assets/' + ${f[1]}}" class="size-[22px]">
        </span>
      </div>
      <div class="mt-[-18px] text-center">
        <p class="text-[20px] font-extrabold text-white">AI 기반 매장 자동 성장의 힘</p>
        <p class="mt-[8px] text-[14px] leading-[20px] font-medium text-[#e0f2fe]">기획, 광고, 분석까지 AI 에이전트<br>BizGent가 알아서 관리해 드립니다.</p>
      </div>
    </div>
  </form>
  <script>
    (() => {
      const modal = document.getElementById("terms-modal");
      const form = modal.querySelector("[data-terms-form]");
      const all = form.querySelector("[data-terms-all]");
      const items = Array.from(form.querySelectorAll("[data-terms-item]"));
      const submit = form.querySelector("[data-terms-submit]");
      const sync = () => {
        const every = items.every((i) => i.checked);
        all.checked = every;
        submit.disabled = !every;
      };
      all.addEventListener("change", () => { items.forEach((i) => (i.checked = all.checked)); sync(); });
      items.forEach((i) => i.addEventListener("change", sync));

      const cancel = () => {
        if (modal.dataset.cancelUrl) location.href = modal.dataset.cancelUrl;
        else BG.closeModal(modal);
      };
      form.querySelector("[data-terms-cancel]").addEventListener("click", cancel);
      modal.addEventListener("modal:close", () => { if (modal.dataset.cancelUrl) location.href = modal.dataset.cancelUrl; });

      // 랜딩의 [data-open-terms="start|heroImage"] 버튼
      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-open-terms]");
        if (!btn) return;
        e.preventDefault();
        form.intent.value = btn.dataset.openTerms;
        BG.openModal("terms-modal");
      });
    })();
  </script>
</div>

<!-- 로그인·회원가입 입력칸 -->
<label th:fragment="authField(label, name, type, value, placeholder, compact, error)" class="flex flex-col gap-[8px]">
  <span class="font-bold text-[#0f172a]" th:classappend="${compact ? 'text-[16px]' : 'text-[17px]'}" th:text="${label}">라벨</span>
  <input th:type="${type}" th:name="${name}" th:value="${value}" th:placeholder="${placeholder}"
         th:attr="aria-invalid=${error != null}" data-clear-error
         class="h-[56px] rounded-[10px] border bg-white px-[16px] font-normal text-[#0f172a] outline-none placeholder:text-[#94a3b8] focus:border-[#2563eb]"
         th:classappend="${(error != null ? 'border-[#dc2626] ' : 'border-[#e2e8f0] ') + (compact ? 'text-[16px]' : 'text-[18px]')}">
  <span th:if="${error != null}" data-error class="text-[13px] font-medium text-[#dc2626]" th:text="${error}">오류</span>
</label>

</html>
