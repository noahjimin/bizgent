<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<!-- 로그인 전 화면 조각 -->

<!-- 체크박스 모양 (바로 앞의 peer 체크박스 상태를 따른다) -->
<th:block th:fragment="checkBox">
  <span class="size-[24px] shrink-0 rounded-[6px] border-2 border-[#cbd5e1] bg-white peer-checked:hidden"></span>
  <span class="hidden size-[24px] shrink-0 items-center justify-center rounded-[6px] bg-[#2563eb] transition-colors peer-checked:flex">
    <svg viewBox="0 0 24 24" fill="none" class="size-[16px]" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
</th:block>

<!--
  이용약관 동의 카드 (SCR-U-001-P01)
  next: 동의 후 이동할 화면(/login 또는 /signup), open: 처음부터 열지 여부, cancelUrl: 취소 시 이동 경로(없으면 닫기만)
-->
<div th:fragment="termsModal(next, open, cancelUrl)" id="terms-modal" data-modal th:hidden="${!open}"
     th:attr="data-cancel-url=${cancelUrl}"
     class="pd-scope fixed inset-0 z-50 flex items-center justify-center bg-[rgba(15,23,42,0.5)] p-[16px] backdrop-blur-[8px] md:p-0">
  <form method="post" th:action="@{/terms/agree}" role="dialog" aria-modal="true" aria-labelledby="terms-title" data-terms-form
        class="relative flex h-[min(580px,100%)] w-full max-w-[900px] overflow-hidden rounded-[24px] bg-white shadow-[0px_24px_48px_0px_rgba(15,23,42,0.25)]">
    <input type="hidden" name="intent" value="start">
    <input type="hidden" name="next" th:value="${next}">
    <button type="button" aria-label="취소" data-terms-cancel
            class="absolute top-[24px] right-[24px] z-10 flex size-[40px] items-center justify-center rounded-[20px] bg-[#f1f5f9] transition-colors duration-150 hover:bg-[#e2e8f0]">
      <img alt="" th:src="@{/assets/9c9d5.svg}" class="size-[16px]">
    </button>

    <div class="flex h-full w-full flex-col justify-between gap-[24px] overflow-y-auto p-[24px] md:w-[495px] md:p-[40px]">
      <div class="flex flex-col gap-[32px]">
        <div class="flex flex-col gap-[8px]">
          <h2 id="terms-title" class="text-[28px] font-extrabold text-[#0f172a]">이용약관</h2>
          <p class="text-[14px] font-medium text-[#94a3b8]">서비스 이용을 위해 아래 약관에 동의해 주세요.</p>
        </div>

        <div>
          <label class="flex cursor-pointer items-center gap-[12px] border-b-2 border-[#e2e8f0] py-[16px]">
            <input type="checkbox" data-terms-all class="peer sr-only">
            <th:block th:replace="~{fragments/auth-parts :: checkBox}"></th:block>
            <span class="text-[18px] font-bold text-[#0f172a]">전체 동의</span>
          </label>
          <label class="flex cursor-pointer items-center gap-[12px] border-b border-[#f1f5f9] py-[14px]">
            <input type="checkbox" data-terms-item class="peer sr-only">
            <th:block th:replace="~{fragments/auth-parts :: checkBox}"></th:block>
            <span class="flex-1 text-[15px] font-medium text-[#475569]">만 14세 이상입니다 (필수)</span>
          </label>
          <label class="flex cursor-pointer items-center gap-[12px] border-b border-[#f1f5f9] py-[14px]">
            <input type="checkbox" data-terms-item class="peer sr-only">
            <th:block th:replace="~{fragments/auth-parts :: checkBox}"></th:block>
            <span class="flex-1 text-[15px] font-medium text-[#475569]"><button type="button" data-terms-doc="service" class="text-[#2563eb] underline underline-offset-2 hover:text-[#1d4ed8]">이용약관</button>에 동의합니다 (필수)</span>
          </label>
          <label class="flex cursor-pointer items-center gap-[12px] border-b border-[#f1f5f9] py-[14px]">
            <input type="checkbox" data-terms-item class="peer sr-only">
            <th:block th:replace="~{fragments/auth-parts :: checkBox}"></th:block>
            <span class="flex-1 text-[15px] font-medium text-[#475569]">개인정보 수집 및 이용에 동의합니다 (필수)</span>
            <button type="button" data-privacy-toggle aria-expanded="false" aria-controls="privacy-detail"
                    class="text-[13px] font-bold text-[#94a3b8] underline underline-offset-2 hover:text-[#475569]">더보기</button>
          </label>
          <!-- ④ 개인정보 수집·이용 상세 -->
          <div id="privacy-detail" data-privacy-detail hidden class="mt-[8px] max-h-[150px] overflow-y-auto rounded-[12px] bg-[#f8fafc] p-[12px]">
            <th:block th:replace="~{fragments/auth-parts :: privacyTable}"></th:block>
          </div>
        </div>
      </div>

      <button type="submit" disabled data-terms-submit
              class="btn-primary flex h-[54px] w-full items-center justify-center rounded-[12px] bg-[#2563eb] text-[18px] font-bold text-white disabled:cursor-not-allowed disabled:bg-[#cbd5e1]">
        동의 및 계속하기
      </button>
    </div>

    <div class="hidden h-full w-[405px] flex-col md:flex items-center justify-center bg-gradient-to-r from-[#2563eb] to-[#14b8a6]">
      <div class="relative size-[320px]">
        <img alt="" th:src="@{/assets/d1f73.svg}" class="absolute top-1/2 left-1/2 size-[200px] -translate-x-1/2 -translate-y-1/2">
        <img alt="" th:src="@{/assets/d2552.svg}" class="absolute top-1/2 left-1/2 size-[140px] -translate-x-1/2 -translate-y-1/2">
        <span class="absolute top-1/2 left-1/2 flex size-[90px] -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white shadow-[0px_8px_12px_rgba(15,23,42,0.15)]">
          <span class="flex size-[48px] items-center justify-center rounded-[14px] bg-gradient-to-br from-[#59c773] via-[#3399f2] to-[#eda633]">
            <img alt="" th:src="@{/assets/ea787.svg}" class="size-[24px]">
          </span>
        </span>
        <span th:each="f : ${ { {'top-[45px] left-[45px]', '8e2d4.svg'}, {'top-[50px] left-[235px]', 'e5e9d.svg'}, {'top-[170px] left-[20px]', 'ccd45.svg'}, {'top-[190px] left-[245px]', '1216c.svg'}, {'top-[255px] left-[138px]', '4228c.svg'} } }"
              class="absolute flex size-[44px] items-center justify-center rounded-full bg-white shadow-[0px_4px_6px_rgba(15,23,42,0.12)]"
              th:classappend="${f[0]}">
          <img alt="" th:src="@{'/assets/' + ${f[1]}}" class="size-[22px]">
        </span>
      </div>
      <div class="mt-[-18px] text-center">
        <p class="text-[20px] font-extrabold text-white">AI 기반 매장 자동 성장의 힘</p>
        <p class="mt-[8px] text-[14px] leading-[20px] font-medium text-[#e0f2fe]">기획, 광고, 분석까지 AI 에이전트<br>BizGent가 알아서 관리해 드립니다.</p>
      </div>
    </div>
  </form>
  <script>
    (() => {
      const modal = document.getElementById("terms-modal");
      const form = modal.querySelector("[data-terms-form]");
      const all = form.querySelector("[data-terms-all]");
      const items = Array.from(form.querySelectorAll("[data-terms-item]"));
      const submit = form.querySelector("[data-terms-submit]");
      const sync = () => {
        const every = items.every((i) => i.checked);
        all.checked = every;
        submit.disabled = !every;
      };
      all.addEventListener("change", () => { items.forEach((i) => (i.checked = all.checked)); sync(); });

      // 더보기: 체크 상태는 그대로 두고 개인정보 상세만 펼치거나 접는다.
      const toggle = form.querySelector("[data-privacy-toggle]");
      const detail = form.querySelector("[data-privacy-detail]");
      toggle.addEventListener("click", (e) => {
        e.preventDefault();
        detail.hidden = !detail.hidden;
        toggle.setAttribute("aria-expanded", String(!detail.hidden));
        toggle.textContent = detail.hidden ? "더보기" : "접기";
      });
      items.forEach((i) => i.addEventListener("change", sync));

      const cancel = () => {
        if (modal.dataset.cancelUrl) location.href = modal.dataset.cancelUrl;
        else BG.closeModal(modal);
      };
      form.querySelector("[data-terms-cancel]").addEventListener("click", cancel);
      modal.addEventListener("modal:close", () => { if (modal.dataset.cancelUrl) location.href = modal.dataset.cancelUrl; });

      // 랜딩의 [data-open-terms="start|heroImage"] 버튼
      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-open-terms]");
        if (!btn) return;
        e.preventDefault();
        form.intent.value = btn.dataset.openTerms;
        BG.openModal("terms-modal");
      });
    })();
  </script>
</div>

<!-- 로그인·회원가입 입력칸 -->
<!-- 개인정보 수집·이용 표 (시연용 예시 문안). 항목은 현재 가입·계정·매장 정보·매출 화면에서 받는 값 -->
<table th:fragment="privacyTable" class="w-full border-collapse text-left text-[12px] leading-[1.5] text-[#475569]">
  <thead>
    <tr class="border-b border-[#e2e8f0] text-[#0f172a]">
      <th scope="col" class="w-[30%] py-[6px] pr-[8px] font-bold">수집 항목</th>
      <th scope="col" class="py-[6px] pr-[8px] font-bold">이용 목적</th>
      <th scope="col" class="w-[22%] py-[6px] font-bold">보관 기간</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="r : ${ {
          {'이메일, 비밀번호', '회원 식별, 로그인', '회원 탈퇴 시까지'},
          {'이름, 연락처', '계정 관리, 문의 응대', '회원 탈퇴 시까지'},
          {'매장명, 업종, 주소, 매장 연락처, 메뉴·상품 정보, 매장·상품 사진, 타겟 고객, 브랜드 톤앤매너', 'AI 캠페인 기획과 콘텐츠 시안 생성', '회원 탈퇴 시까지'},
          {'매출 데이터(엑셀·CSV 파일, 영수증 사진, 직접 입력 값)', '캠페인 성과분석과 개선 방향 제안', '회원 탈퇴 시까지'},
          {'캠페인 기록, 약관 동의 여부·일시', '서비스 이용 기록 관리', '회원 탈퇴 시까지'}
        } }" class="border-b border-[#eef1f5] align-top last:border-b-0">
      <td class="py-[6px] pr-[8px]" th:text="${r[0]}"></td>
      <td class="py-[6px] pr-[8px]" th:text="${r[1]}"></td>
      <td class="py-[6px]" th:text="${r[2]}"></td>
    </tr>
  </tbody>
</table>

<!--
  약관 전문 팝업 (SCR-U-001-P01 ③): [data-terms-doc="service|privacy"]로 연다.
  약관 동의 팝업 위에 뜨므로 termsModal보다 뒤에 넣는다. 문안은 시연용 예시다.
-->
<div th:fragment="termsDocModal" id="terms-doc-modal" data-modal data-backdrop-close role="presentation" hidden
     class="pd-scope fixed inset-0 z-[60] flex items-center justify-center bg-[rgba(15,23,42,0.4)] p-[16px] md:p-[24px]">
  <section role="dialog" aria-modal="true" aria-labelledby="terms-doc-title"
           class="flex max-h-full w-full max-w-[640px] flex-col overflow-hidden rounded-[24px] bg-white shadow-[0px_24px_48px_0px_rgba(15,23,42,0.25)]">
    <div class="flex items-start justify-between gap-[16px] border-b border-[#eef1f5] px-[32px] pt-[28px] pb-[20px]">
      <div class="flex flex-col gap-[6px]">
        <h2 id="terms-doc-title" data-terms-doc-title class="text-[24px] font-extrabold text-[#0f172a]">이용약관</h2>
        <p class="text-[13px] font-medium text-[#94a3b8]">시연용 예시 약관입니다. 정식 서비스 전에 내용이 바뀔 수 있어요.</p>
      </div>
      <button type="button" data-modal-close aria-label="닫기"
              class="flex size-[40px] shrink-0 items-center justify-center rounded-[20px] bg-[#f1f5f9] transition-colors duration-150 hover:bg-[#e2e8f0]">
        <img alt="" th:src="@{/assets/9c9d5.svg}" class="size-[16px]">
      </button>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto px-[32px] py-[24px]">
      <div data-terms-doc-body="service" class="flex flex-col gap-[18px]">
        <section th:each="a : ${ {
              {'제1조 (목적)', '이 약관은 팀 사계절이 제공하는 BizGent 서비스(이하 “서비스”)의 이용 조건과 절차, 회원과 서비스 제공자의 권리·의무를 정하는 것을 목적으로 합니다.'},
              {'제2조 (서비스 내용)', '서비스는 소상공인 회원이 입력한 매장·상품 정보와 마케팅 목표를 바탕으로 AI 캠페인 기획, 홍보 문구·광고 이미지 시안 생성, 채널 게시, 매출 데이터 기반 성과분석과 다음 캠페인 개선 방향 제안을 제공합니다.'},
              {'제3조 (회원가입과 계정)', '회원은 이 약관과 개인정보 수집·이용에 동의한 뒤 이메일로 가입합니다. 회원은 계정 정보를 정확하게 입력하고 직접 관리해야 하며, 계정을 다른 사람에게 빌려줄 수 없습니다.'},
              {'제4조 (이용 요금)', '무료 플랜은 매월 캠페인 3회를 이용할 수 있고, 구독 플랜(월 9,900원)은 월 이용 횟수 확대와 AI 기획 재분석·AI 문구 대안·AI 이미지 수정·참고 이미지 활용 기능을 제공합니다. 시연 버전에서는 실제 결제가 이루어지지 않습니다.'},
              {'제5조 (AI 생성 콘텐츠)', 'AI가 만든 기획과 시안은 참고용 제안입니다. 회원은 게시 전에 문구, 이미지, 가격·할인 정보 등이 사실과 맞는지 직접 확인해야 하며, 게시한 콘텐츠에 대한 책임은 회원에게 있습니다.'},
              {'제6조 (회원의 의무)', '회원은 다른 사람의 권리를 침해하거나 법령에 어긋나는 내용(허위·과장 광고, 타인의 저작물·초상 무단 사용 등)을 입력하거나 게시해서는 안 됩니다.'},
              {'제7조 (서비스 변경과 중단)', '서비스는 캡스톤디자인 프로젝트의 시연 버전으로, 개발 과정에서 기능이 바뀌거나 일시 중단될 수 있습니다. 시연 버전의 채널 게시는 실제 SNS·블로그에 올라가지 않는 모의 기능입니다.'},
              {'제8조 (회원 탈퇴)', '회원은 설정 > 계정 관리에서 언제든 탈퇴할 수 있습니다. 탈퇴하면 매장 정보, 캠페인 기록, 매출 데이터가 삭제되어 다시 볼 수 없습니다.'}
            } }" class="flex flex-col gap-[6px]">
          <h3 class="text-[15px] font-bold text-[#0f172a]" th:text="${a[0]}"></h3>
          <p class="text-[14px] leading-[1.7] font-normal text-[#475569]" th:text="${a[1]}"></p>
        </section>
      </div>

      <div data-terms-doc-body="privacy" hidden class="flex flex-col gap-[18px]">
        <p class="text-[14px] leading-[1.7] font-normal text-[#475569]">팀 사계절은 BizGent 서비스 제공을 위해 아래와 같이 개인정보를 수집·이용합니다.</p>
        <div class="rounded-[12px] bg-[#f8fafc] p-[16px]">
          <th:block th:replace="~{fragments/auth-parts :: privacyTable}"></th:block>
        </div>
        <section th:each="a : ${ {
              {'파기', '회원이 탈퇴하면 수집한 개인정보를 지체 없이 삭제합니다.'},
              {'제3자 제공', '회원의 개인정보를 다른 곳에 제공하지 않습니다.'},
              {'동의를 거부할 권리', '개인정보 수집·이용에 동의하지 않을 수 있습니다. 다만 필수 항목에 동의하지 않으면 회원가입과 서비스 이용이 어렵습니다.'}
            } }" class="flex flex-col gap-[6px]">
          <h3 class="text-[15px] font-bold text-[#0f172a]" th:text="${a[0]}"></h3>
          <p class="text-[14px] leading-[1.7] font-normal text-[#475569]" th:text="${a[1]}"></p>
        </section>
      </div>
    </div>

    <div class="flex justify-end border-t border-[#eef1f5] px-[32px] py-[16px]">
      <button type="button" data-modal-close
              class="btn-primary flex h-[44px] items-center rounded-[12px] bg-[#2563eb] px-[28px] text-[15px] font-bold text-white">확인</button>
    </div>
  </section>
  <script>
    (() => {
      const modal = document.getElementById("terms-doc-modal");
      const titles = { service: "이용약관", privacy: "개인정보 수집 및 이용" };
      // 약관 동의 팝업의 체크박스 줄 안에서 눌러도 체크 상태가 바뀌지 않게 기본 동작을 막는다.
      document.addEventListener("click", (e) => {
        const opener = e.target.closest("[data-terms-doc]");
        if (!opener) return;
        e.preventDefault();
        const doc = opener.dataset.termsDoc;
        modal.querySelector("[data-terms-doc-title]").textContent = titles[doc];
        modal.querySelectorAll("[data-terms-doc-body]").forEach((b) => (b.hidden = b.dataset.termsDocBody !== doc));
        BG.openModal("terms-doc-modal");
        modal.querySelector(".overflow-y-auto").scrollTop = 0;
      });
    })();
  </script>
</div>

<label th:fragment="authField(label, name, type, value, placeholder, compact, error)" class="flex flex-col gap-[8px]">
  <span class="font-bold text-[#0f172a]" th:classappend="${compact ? 'text-[16px]' : 'text-[17px]'}" th:text="${label}">라벨</span>
  <span class="relative flex">
    <input th:type="${type}" th:name="${name}" th:value="${value}" th:placeholder="${placeholder}"
           th:attr="aria-invalid=${error != null}" data-clear-error
           class="h-[56px] w-full rounded-[10px] border bg-white px-[16px] font-normal text-[#0f172a] outline-none placeholder:text-[#94a3b8] focus:border-[#2563eb]"
           th:classappend="${(error != null ? 'border-[#dc2626] ' : 'border-[#e2e8f0] ') + (compact ? 'text-[16px]' : 'text-[18px]') + (type == 'password' ? ' pr-[52px]' : '')}">
    <!-- SCR-U-001 ②: 입력값은 그대로 두고 보기·숨김만 전환 -->
    <button th:if="${type == 'password'}" type="button" data-pw-toggle aria-label="비밀번호 보기" aria-pressed="false"
            class="absolute inset-y-0 right-[8px] my-auto flex size-[40px] items-center justify-center rounded-[8px] text-[#94a3b8] hover:text-[#475569]">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
        <path data-pw-slash d="M3 3l18 18" style="display:none"/>
      </svg>
    </button>
  </span>
  <span th:if="${error != null}" data-error class="text-[13px] font-medium text-[#dc2626]" th:text="${error}">오류</span>
</label>

</html>
